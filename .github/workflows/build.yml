# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# Tag pushes (v*) are NOT built here: release.yml builds + tests them itself, so running
# the ~1400-test gametest suite here as well just doubled the CI time of every release.
#
# The gametest suite is split into 3 disjoint slices (-PtestShard=i/3, see build.gradle) that run on
# three runners at once; the jar build runs on a fourth. Every test still runs exactly once.

name: build
on:
  pull_request:
  push:
    branches: ['**']

# A newer push to the same branch/PR makes the older run pointless: cancel it.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    name: gametest (slice ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle (caches ~/.gradle incl. the Minecraft/Loom remap caches)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run this slice of the gametest suite
        run: ./gradlew runGameTest -PtestShard=${{ matrix.shard }}/3 --console=plain
      - name: capture gametest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report-${{ matrix.shard }}
          path: build/reports/gametest.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build (compile + jars; the gametests run in the parallel "gametest" jobs)
        run: ./gradlew build -x runGameTest --console=plain
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
