# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# Tag pushes (v*) are NOT built here: release.yml builds + tests them itself, so running
# the ~1400-test gametest suite here as well just doubled the CI time of every release.
#
# v0.15.21: a "plan" job (.github/scripts/select-gametests.js) decides what each push needs:
#   none   -- only docs / client code / textures / models / sounds changed: no gametests (the jar build still runs)
#   subset -- only the test classes that touch the changed feature packages / data files, on one runner
#   full   -- anything shared changed (core packages, build files, mixins...): the whole suite as 6 disjoint slices
#             (-PtestShard=i/6, see build.gradle) on six runners at once
# Release tags always get the FULL suite (release.yml only skips its own run when master already ran the full suite on
# that exact commit). Run this workflow by hand (Actions -> build -> Run workflow) to force a full run.

name: build
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push to the same branch/PR makes the older run pointless: cancel it.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      filter: ${{ steps.select.outputs.filter }}
      shards: ${{ steps.select.outputs.shards }}
      shard_count: ${{ steps.select.outputs.shard_count }}
    steps:
      - name: checkout repository (full history, to diff against the previous push)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: pick the gametests this push needs
        id: select
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node .github/scripts/select-gametests.js "$BASE" "$HEAD"

  gametest:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    name: gametest ${{ needs.plan.outputs.mode }} (slice ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle (caches ~/.gradle incl. the Minecraft/Loom remap caches)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run this slice of the gametest suite
        env:
          TEST_FILTER: ${{ needs.plan.outputs.filter }}
          SHARD: ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            ./gradlew runGameTest -PtestShard="$SHARD" -PtestFilter="$TEST_FILTER" --console=plain
          else
            ./gradlew runGameTest -PtestShard="$SHARD" --console=plain
          fi
      - name: capture gametest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report-${{ matrix.shard }}
          path: build/reports/gametest.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build (compile + jars; the gametests run in the parallel "gametest" jobs)
        run: ./gradlew build -x runGameTest --console=plain
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
