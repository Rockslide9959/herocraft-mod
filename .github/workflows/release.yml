# Publishes a release of Project Hero to CurseForge and GitHub Releases.
#
# Trigger: pushing a git tag shaped like `v0.9.21`.
# The full release flow is therefore:
#
#   1. bump `version=` in gradle.properties, commit
#   2. git tag -a v0.9.21 -m "short changelog line(s)"
#   3. git push origin master --tags
#
# ...and this workflow builds the jar, verifies the tag matches gradle.properties,
# then uploads to CurseForge and creates the matching GitHub Release. The tag's
# annotation message becomes the changelog on both.
#
# v0.16.1: usually there is nothing to build or test here. When master CI (build.yml) already passed the full suite on
# the tagged commit, and built its jar, the run is just: gate (~15 s) -> download that jar -> publish -> Discord.
# See the "tested" job and .github/scripts/release-gate.sh.
#
# One-time setup before the first run:
#   - CurseForge project created: id 1684169 (set in `curseforge-id` below).
#   - Add a repo secret named CURSEFORGE_TOKEN (Settings > Secrets and variables >
#     Actions) holding a CurseForge API token from
#     https://legacy.curseforge.com/account/api-tokens
#   - The project must be approved by CurseForge moderation before an API upload
#     will succeed.
#   - Add a repo secret named DISCORD_WEBHOOK_URL (a #changelog channel webhook,
#     Discord: Edit Channel > Integrations > Webhooks) to auto-post the tag's
#     changelog message to Discord on release.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release
  actions: read     # look up the master CI run of the tagged commit

jobs:
  # v0.16.1 gate (.github/scripts/release-gate.sh). The suite is NOT run again when master CI (build.yml) already
  # passed the FULL suite on this exact commit -- or on an earlier master commit, when everything changed since is
  # something the suite never sees (select-gametests.js says "none": docs, client code, textures, the version bump).
  # A build.yml run of this commit still in progress is waited for. With no such green run (or a red one) the full
  # suite runs below, so nothing is ever published untested. The gate also finds the jar build.yml already built for
  # this exact commit, so the release does not build it a second time.
  tested:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      green: ${{ steps.gate.outputs.green }}
      jar_run: ${{ steps.gate.outputs.jar_run }}
    steps:
      - name: checkout repository (full history, for the earlier-commit check)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: find a green master CI run and a built jar for this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/release-gate.sh

  # The full suite as 8 slices on 8 runners (same runner script as build.yml, incl. the one on-its-own retry of a
  # failed test) -- only when the gate found no green run. Publishing needs every slice to pass.
  test:
    needs: tested
    if: needs.tested.outputs.green != 'true'
    name: gametest (slice ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: chmod +x ./gradlew
      - name: run this slice of the gametest suite
        run: bash .github/scripts/run-gametests.sh "${{ matrix.shard }}/8"
      - name: capture gametest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report-${{ matrix.shard }}
          path: build/reports/gametest*.xml
          if-no-files-found: ignore

  # Only when master CI has no jar for this commit (normally it has: the tag points at a pushed master commit).
  build:
    needs: tested
    if: needs.tested.outputs.jar_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: chmod +x ./gradlew
      - run: mkdir -p ~/.gradle && echo "org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
      - name: build the jars (tests run in the parallel "test" job)
        run: ./gradlew build -x runGameTest --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: build/libs/

  release:
    needs: [tested, test, build]
    # "test" is skipped when the gate found a green full run, "build" when it found master's jar; otherwise each must
    # have succeeded
    if: always() && needs.tested.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.tested.outputs.green == 'true')) && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.tested.outputs.jar_run != ''))
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need the tag object for its annotation message

      - name: fetch the jar master CI already built for this commit
        if: needs.tested.outputs.jar_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.tested.outputs.jar_run }}
        run: gh run download "$RUN_ID" -R "$REPO" -n Artifacts -D build/libs

      - name: download the jars built above
        if: needs.tested.outputs.jar_run == ''
        uses: actions/download-artifact@v5
        with:
          name: jars
          path: build/libs/

      - name: read mod version
        id: meta
        run: |
          VERSION="$(grep -E '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version $VERSION"
            exit 1
          fi
          ls -la build/libs
          if [ ! -f "build/libs/projecthero-$VERSION.jar" ]; then
            echo "::error::build/libs has no projecthero-$VERSION.jar to publish"
            exit 1
          fi
          {
            echo "changelog<<__EOF__"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ---- CurseForge ----
          curseforge-id: 1684169
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # ---- GitHub Releases ----
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # ---- shared ----
          name: Project Hero ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: release
          changelog: ${{ steps.meta.outputs.changelog }}
          # CurseForge occasionally answers 500: retry hard before giving up (a failure stops the run visibly)
          retry-attempts: 6
          retry-delay: 20000
          files: build/libs/!(*-sources).jar
          # game versions, mod loaders and required dependencies (Fabric API,
          # GeckoLib) are read automatically from src/main/resources/fabric.mod.json

      - name: notify discord
        if: success()
        # no continue-on-error: a failed Discord post must show up as a failed run so it gets noticed and fixed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set - the release was NOT announced"
            exit 1
          fi
          # Long changelogs are split at line breaks into embeds (Discord: 4096 chars per embed description), and the
          # embeds into as many MESSAGES as needed (6000 chars / 10 embeds per message) -- nothing is cut off.
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          chunks, cur = [], ""
          for line in os.environ["CHANGELOG"].split("\n"):
              while len(line) > 3900:
                  chunks.append(line[:3900])
                  line = line[3900:]
              if cur and len(cur) + len(line) + 1 > 3900:
                  chunks.append(cur)
                  cur = ""
              cur += ("\n" if cur else "") + line
          if cur:
              chunks.append(cur)
          title = "Project Hero " + version
          messages, embeds, total = [], [], len(title)
          for c in chunks:
              if embeds and (total + len(c) > 5800 or len(embeds) == 10):
                  messages.append(embeds)
                  embeds, total = [], 0
              e = {"description": c, "color": 3066993}
              if not messages and not embeds:
                  e["title"] = title
                  e["url"] = os.environ["RELEASE_URL"]
              embeds.append(e)
              total += len(c)
          if embeds:
              messages.append(embeds)
          for i, m in enumerate(messages):
              payload = {"embeds": m, "allowed_mentions": {"parse": []}}
              if i == 0:
                  payload["content"] = "@everyone Project Hero " + version + " is out! Please wait about 20 minutes for CurseForge to verify the mod update before it shows up."
                  payload["allowed_mentions"] = {"parse": ["everyone"]}
              if len(messages) > 1:
                  m[-1]["footer"] = {"text": "Part %d of %d" % (i + 1, len(messages))}
              with open("discord_payload_%02d.json" % i, "w") as f:
                  json.dump(payload, f)
          print("Discord messages:", len(messages), "embeds:", sum(len(m) for m in messages))
          PY
          for p in discord_payload_*.json; do
            code=$(curl -s -o discord_response.txt -w "%{http_code}" --retry 5 --retry-delay 10 --retry-all-errors -H "Content-Type: application/json" -d @"$p" "$DISCORD_WEBHOOK_URL")
            echo "Discord answered HTTP $code for $p"
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then
              cat discord_response.txt
              echo "::error::Discord post failed (HTTP $code)"
              exit 1
            fi
            sleep 2
          done
