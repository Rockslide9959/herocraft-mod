# Publishes a release of Project Hero to CurseForge and GitHub Releases.
#
# Trigger: pushing a git tag shaped like `v0.9.21`.
# The full release flow is therefore:
#
#   1. bump `version=` in gradle.properties, commit
#   2. git tag -a v0.9.21 -m "short changelog line(s)"
#   3. git push origin master --tags
#
# ...and this workflow builds the jar, verifies the tag matches gradle.properties,
# then uploads to CurseForge and creates the matching GitHub Release. The tag's
# annotation message becomes the changelog on both.
#
# One-time setup before the first run:
#   - CurseForge project created: id 1684169 (set in `curseforge-id` below).
#   - Add a repo secret named CURSEFORGE_TOKEN (Settings > Secrets and variables >
#     Actions) holding a CurseForge API token from
#     https://legacy.curseforge.com/account/api-tokens
#   - The project must be approved by CurseForge moderation before an API upload
#     will succeed.
#   - Add a repo secret named DISCORD_WEBHOOK_URL (a #changelog channel webhook,
#     Discord: Edit Channel > Integrations > Webhooks) to auto-post the tag's
#     changelog message to Discord on release.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release
  actions: read     # look up the master CI run of the tagged commit

jobs:
  # v0.15.19: the tagged commit has almost always just been through the full suite on master (build.yml). If that
  # run passed for this EXACT commit, the suite is not run a second time here -- the release goes straight to
  # build + publish. A build.yml run still in progress for the commit is waited for; with no green run (or a red
  # one) the full suite runs below exactly as before, so nothing is ever published untested.
  tested:
    runs-on: ubuntu-24.04
    outputs:
      green: ${{ steps.find.outputs.green }}
    steps:
      - name: find a green master CI run of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          green=false
          runs="$(gh run list -R "$REPO" --workflow build.yml --commit "$SHA" --json databaseId,status,conclusion --limit 20)"
          echo "$runs"
          if [ "$(echo "$runs" | jq "[.[] | select(.conclusion == \"success\")] | length")" -gt 0 ]; then
            green=true
          else
            pending="$(echo "$runs" | jq -r "[.[] | select(.status != \"completed\")][0].databaseId // empty")"
            if [ -n "$pending" ]; then
              echo "waiting for build.yml run $pending on $SHA"
              if timeout 1500 gh run watch "$pending" -R "$REPO" --exit-status --interval 20 > /dev/null; then
                green=true
              fi
            fi
          fi
          echo "green=$green" | tee -a "$GITHUB_OUTPUT"

  # The gametest suite (the slow part) runs as 3 disjoint slices (-PtestShard=i/3) on 3 runners at once, beside the jar
  # build -- only when the commit has no green master CI run (see "tested" above). Publishing needs ALL of them to
  # pass, so nothing is released unless every test passed somewhere for this commit.
  test:
    needs: tested
    if: needs.tested.outputs.green != 'true'
    name: gametest (slice ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: run this slice of the gametest suite
        run: ./gradlew runGameTest -PtestShard=${{ matrix.shard }}/3 --console=plain
      - name: capture gametest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report-${{ matrix.shard }}
          path: build/reports/gametest.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: build the jars (tests run in the parallel "test" job)
        run: ./gradlew build -x runGameTest --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: build/libs/

  release:
    needs: [tested, test, build]
    # "test" is skipped when master CI already passed this commit; it must otherwise have succeeded
    if: always() && needs.tested.result == 'success' && needs.build.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.tested.outputs.green == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need the tag object for its annotation message

      - name: download the built jars
        uses: actions/download-artifact@v5
        with:
          name: jars
          path: build/libs/

      - name: read mod version
        id: meta
        run: |
          VERSION="$(grep -E '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version $VERSION"
            exit 1
          fi
          {
            echo "changelog<<__EOF__"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ---- CurseForge ----
          curseforge-id: 1684169
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          # ---- GitHub Releases ----
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # ---- shared ----
          name: Project Hero ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: release
          changelog: ${{ steps.meta.outputs.changelog }}
          # CurseForge occasionally answers 500: retry hard before giving up (a failure stops the run visibly)
          retry-attempts: 6
          retry-delay: 20000
          files: build/libs/!(*-sources).jar
          # game versions, mod loaders and required dependencies (Fabric API,
          # GeckoLib) are read automatically from src/main/resources/fabric.mod.json

      - name: notify discord
        if: success()
        # no continue-on-error: a failed Discord post must show up as a failed run so it gets noticed and fixed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set - the release was NOT announced"
            exit 1
          fi
          # Long changelogs are split at line breaks into embeds (Discord: 4096 chars per embed description), and the
          # embeds into as many MESSAGES as needed (6000 chars / 10 embeds per message) -- nothing is cut off.
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          chunks, cur = [], ""
          for line in os.environ["CHANGELOG"].split("\n"):
              while len(line) > 3900:
                  chunks.append(line[:3900])
                  line = line[3900:]
              if cur and len(cur) + len(line) + 1 > 3900:
                  chunks.append(cur)
                  cur = ""
              cur += ("\n" if cur else "") + line
          if cur:
              chunks.append(cur)
          title = "Project Hero " + version
          messages, embeds, total = [], [], len(title)
          for c in chunks:
              if embeds and (total + len(c) > 5800 or len(embeds) == 10):
                  messages.append(embeds)
                  embeds, total = [], 0
              e = {"description": c, "color": 3066993}
              if not messages and not embeds:
                  e["title"] = title
                  e["url"] = os.environ["RELEASE_URL"]
              embeds.append(e)
              total += len(c)
          if embeds:
              messages.append(embeds)
          for i, m in enumerate(messages):
              payload = {"embeds": m, "allowed_mentions": {"parse": []}}
              if i == 0:
                  payload["content"] = "@everyone Project Hero " + version + " is out! Please wait about 20 minutes for CurseForge to verify the mod update before it shows up."
                  payload["allowed_mentions"] = {"parse": ["everyone"]}
              if len(messages) > 1:
                  m[-1]["footer"] = {"text": "Part %d of %d" % (i + 1, len(messages))}
              with open("discord_payload_%02d.json" % i, "w") as f:
                  json.dump(payload, f)
          print("Discord messages:", len(messages), "embeds:", sum(len(m) for m in messages))
          PY
          for p in discord_payload_*.json; do
            code=$(curl -s -o discord_response.txt -w "%{http_code}" --retry 5 --retry-delay 10 --retry-all-errors -H "Content-Type: application/json" -d @"$p" "$DISCORD_WEBHOOK_URL")
            echo "Discord answered HTTP $code for $p"
            if [ "$code" != "204" ] && [ "$code" != "200" ]; then
              cat discord_response.txt
              echo "::error::Discord post failed (HTTP $code)"
              exit 1
            fi
            sleep 2
          done
