# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.3
loom_version=1.17.20

# Mod Properties
version=0.10.12
group=com.projecthero.mod

# Dependencies
fabric_api_version=0.116.15+1.21.1
# GeckoLib animation engine -- powers the custom GeckoLib armour models (see docs/ARMOR_MODELS.md).
geckolib_version=4.9.2

# Project Hero dev tooling
# Set this to the "mods" folder of a CurseForge App instance to have `gradlew build`
# automatically copy the built jar there. Example:
# modpackModsDir=C:\\Users\\ethan\\curseforge\\minecraft\\Instances\\<InstanceName>\\mods
# Leave blank/commented out to skip the copy step.
modpackModsDir=C\:\\Users\\ethan\\curseforge\\minecraft\\Instances\\herocraft test\\mods
